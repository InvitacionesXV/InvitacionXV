<!DOCTYPE html>
<html lang="es" oncontextmenu="return false;">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta charset="utf-8" />
    <title>Invitación XV</title>
    <style>
        :root {
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            object-fit: contain;
            /* ✅ VER TODO */
            object-position: center;
            background: #000;
            /* barras */
            z-index: 0;
            pointer-events: none;
        }

        .shield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            z-index: 10;
            background: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        .ui {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .play-btn {
            pointer-events: auto;
            font: 600 16px system-ui;
            padding: 14px 22px;
            border: 0;
            border-radius: 999px;
            background: #fff;
            color: #000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
        }

        .hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: #fff;
            font: 500 12px system-ui;
            opacity: .85;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <video id="bg" class="bg-video" playsinline webkit-playsinline loop preload="auto" disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback" src="esESTEEEEEE.mp4"></video>

    <div class="shield" id="shield"></div>

    <div class="ui" id="ui"><button class="play-btn" id="playBtn">Entrar</button></div>

    <div class="hint">Tocá “Entrar” para activar el sonido</div>

    <script>
        (function () {
            const video = document.getElementById('bg');
            const playBtn = document.getElementById('playBtn');
            const ui = document.getElementById('ui');
            const shield = document.getElementById('shield');

            const block = e => {
                e.preventDefault();
                e.stopPropagation();
                return false;
            };
            ['contextmenu', 'dragstart', 'selectstart', 'gesturestart'].forEach(evt => {
                document.addEventListener(evt, block, {
                    passive: false
                });
                shield.addEventListener(evt, block, {
                    passive: false
                });
            });
            ['touchstart', 'touchend', 'pointerdown', 'pointerup'].forEach(evt => {
                shield.addEventListener(evt, block, {
                    passive: false
                });
            });

            async function startPlayback() {
                try {
                    video.muted = false;
                    video.volume = 1;
                    try {
                        video.load();
                    } catch {}
                    await video.play();
                    ui.style.display = 'none';
                } catch (err) {
                    console.warn('No se pudo reproducir:', err);
                    ui.style.display = '';
                }
            }
            playBtn.addEventListener('click', startPlayback, {
                passive: true
            });

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && !video.paused) {
                    try {
                        video.muted = false;
                        video.volume = 1;
                    } catch {}
                }
            });
        })();
    </script>

</body>

</html>
