<!DOCTYPE html>
<html lang="es" oncontextmenu="return false;">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta charset="utf-8" />
    <title>Invitación XV</title>
    <style>
        :root {
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            object-fit: contain;
            object-position: center;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .shield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            z-index: 10;
            background: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        /* UI centrada para el ícono */
        .ui {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 20;
            pointer-events: none;
        }

        /* Ícono de PLAY */
        .play-icon {
            pointer-events: auto;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
            transition: transform 0.25s ease;
        }

        .play-icon:hover {
            transform: scale(1.07);
        }

        .play-icon svg {
            width: 40px;
            fill: #000;
        }

        .hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: #fff;
            font: 500 12px system-ui;
            opacity: .85;
            pointer-events: none;
        }

        /* zonas táctiles de diapositivas */
        .jump-left,
        .jump-right {
            position: fixed;
            top: 0;
            width: 30%;
            height: 100dvh;
            background: transparent;
            z-index: 30;
            pointer-events: auto;
        }

        .jump-left {
            left: 0;
        }

        .jump-right {
            right: 0;
        }
    </style>
</head>

<body>

    <video id="bg" class="bg-video" playsinline webkit-playsinline loop preload="auto" disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback" src="esESTEEEEEE.mp4"></video>

    <div class="shield" id="shield"></div>

    <!-- ÍCONO DE PLAY -->
    <div class="ui" id="ui">
        <div class="play-icon" id="playBtn">
            <svg viewBox="0 0 100 100">
                <polygon points="35,25 75,50 35,75" />
            </svg>
        </div>
    </div>

    <div class="hint">Tocá para activar el sonido</div>

    <div class="jump-left" id="jumpLeft"></div>
    <div class="jump-right" id="jumpRight"></div>

    <script>
        (function () {
            const video = document.getElementById('bg');
            const playBtn = document.getElementById('playBtn');
            const ui = document.getElementById('ui');
            const shield = document.getElementById('shield');

            /* bloquear menú y long-press */
            const block = e => {
                e.preventDefault();
                e.stopPropagation();
                return false;
            };
            ['contextmenu', 'dragstart', 'selectstart', 'gesturestart'].forEach(evt => {
                document.addEventListener(evt, block, {
                    passive: false
                });
                shield.addEventListener(evt, block, {
                    passive: false
                });
            });
            ['touchstart', 'touchend', 'pointerdown', 'pointerup'].forEach(evt => {
                shield.addEventListener(evt, block, {
                    passive: false
                });
            });

            /* reproducir video con audio */
            async function startPlayback() {
                try {
                    video.muted = false;
                    video.volume = 1;
                    try {
                        video.load();
                    } catch {}
                    await video.play();
                    ui.style.display = 'none';
                } catch (err) {
                    console.warn('No se pudo reproducir:', err);
                    ui.style.display = '';
                }
            }

            playBtn.addEventListener('click', startPlayback, {
                passive: true
            });

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && !video.paused) {
                    try {
                        video.muted = false;
                        video.volume = 1;
                    } catch {}
                }
            });

            /* ===========================
               SISTEMA DE DIAPOSITIVAS
               =========================== */

            const jumpLeft = document.getElementById('jumpLeft');
            const jumpRight = document.getElementById('jumpRight');

            const slides = [3, 27, 31, 37, 55, 63, 68, 72];
            let slideIndex = 0;

            function goToSlide(i) {
                if (i < 0) i = 0;
                if (i >= slides.length) i = slides.length - 1;
                slideIndex = i;
                video.currentTime = slides[slideIndex];
            }

            jumpRight.addEventListener('click', () => {
                if (video.paused) return;
                if (slideIndex < slides.length - 1) goToSlide(slideIndex + 1);
            });

            jumpLeft.addEventListener('click', () => {
                if (video.paused) return;
                if (slideIndex > 0) goToSlide(slideIndex - 1);
            });

            video.addEventListener('timeupdate', () => {
                if (video.currentTime < 1) slideIndex = 0;
            });

        })();
    </script>

</body>

</html>
